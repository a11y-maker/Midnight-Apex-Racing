<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C1 NOCTURNE: Midnight Highway</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body { background: #020204; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; height: 100vh; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .interactive { pointer-events: auto; }
        
        .menu-screen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(8, 9, 14, 0.94); border: 2px solid #00f3ff; box-shadow: 0 0 25px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.1); padding: 35px; border-radius: 14px; width: 380px; text-align: center; backdrop-filter: blur(10px); }
        h1 { color: #00f3ff; font-size: 28px; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 12px #00f3ff; margin-bottom: 5px; }
        h3 { color: #ff0055; font-size: 13px; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 22px; }
        
        .btn { background: linear-gradient(135deg, #00f3ff, #0055ff); border: none; color: white; padding: 14px 20px; font-weight: bold; width: 100%; font-size: 15px; border-radius: 8px; cursor: pointer; margin-top: 12px; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.15s, box-shadow 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(0, 243, 255, 0.7); }
        .btn-alt { background: linear-gradient(135deg, #ff0055, #ff5500); }
        .btn-alt:hover { box-shadow: 0 0 20px rgba(255, 0, 85, 0.7); }

        input { width: 100%; padding: 12px; background: rgba(255,255,255,0.08); border: 1px solid #00f3ff; color: white; text-align: center; font-size: 16px; border-radius: 8px; margin: 10px 0; outline: none; }
        
        #hud { display: none; width: 100%; justify-content: space-between; align-items: flex-start; }
        .hud-card { background: rgba(4, 6, 12, 0.85); border: 1px solid rgba(0, 243, 255, 0.4); padding: 15px 22px; border-radius: 10px; backdrop-filter: blur(6px); box-shadow: 0 0 15px rgba(0,0,0,0.8); }
        .speed-title { font-size: 11px; color: #88a; text-transform: uppercase; letter-spacing: 1px; }
        .speed-val { font-size: 36px; font-weight: 800; color: #00f3ff; text-shadow: 0 0 10px #00f3ff; line-height: 1; }
        .unit { font-size: 13px; color: #aaa; }
        
        .nitro-bar-container { width: 160px; height: 10px; background: rgba(255,255,255,0.15); border-radius: 5px; margin-top: 10px; overflow: hidden; border: 1px solid rgba(0,243,255,0.3); }
        .nitro-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #0066ff, #00f3ff); box-shadow: 0 0 10px #00f3ff; transition: width 0.1s; }
        
        .pos-badge { font-size: 32px; font-weight: 800; color: #ff0055; text-shadow: 0 0 12px #ff0055; text-align: right; line-height: 1; margin-top: 4px; }
        .status-msg { font-size: 11px; color: #ffcc00; margin-top: 6px; text-align: right; letter-spacing: 1px; }

        #controls-hint { font-size: 12px; color: #889; margin-top: 18px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; line-height: 1.6; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="hud">
            <div class="hud-card">
                <div class="speed-title">Kelajuan</div>
                <div><span class="speed-val" id="speed-num">0</span> <span class="unit">KM/H</span></div>
                <div class="nitro-bar-container"><div class="nitro-bar" id="nitro-fill"></div></div>
            </div>
            <div class="hud-card" style="text-align: right;">
                <div class="speed-title">Kedudukan</div>
                <div class="pos-badge" id="pos-text">1ST</div>
                <div class="status-msg" id="mode-text">VS AI (PRO)</div>
            </div>
        </div>

        <!-- MAIN MENU -->
        <div class="menu-screen interactive" id="main-menu">
            <h1>C1 NOCTURNE</h1>
            <h3>Midnight Highway</h3>
            <button class="btn" onclick="startSingleplayer()">Main VS AI</button>
            <button class="btn btn-alt" onclick="showOnlineMenu()">Online Multiplayer</button>
            <div id="controls-hint">
                <b>Kawalan Pemanduan:</b><br>
                [W / ↑] Pecutan | [S / ↓] Brek<br>
                [A/D / ←/→] Stereng | [SPACE] Nitro Boost
            </div>
        </div>

        <!-- ONLINE MENU -->
        <div class="menu-screen interactive" id="online-menu" style="display: none;">
            <h1>ONLINE MATCH</h1>
            <h3>Sambungan Peer-to-Peer</h3>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 12px;">Masukkan ID Bilik yang sama dengan rakan anda:</p>
            <input type="text" id="room-id-input" value="TOKYO88">
            <button class="btn" onclick="startOnlineMatch()">Masuk Bilik</button>
            <button class="btn btn-alt" style="margin-top: 8px;" onclick="hideOnlineMenu()">Kembali</button>
        </div>

        <!-- GAME OVER SCREEN -->
        <div class="menu-screen interactive" id="game-over-menu" style="display: none;">
            <h1 id="result-title">TAMAT</h1>
            <h3 id="result-sub">Keputusan Perlumbaan</h3>
            <p id="result-desc" style="margin-bottom: 18px; font-size: 15px; color: #ccc;"></p>
            <button class="btn" onclick="returnToMenu()">Ke Menu Utama</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let playerCar, opponentCar;
        let trafficCars = [];
        let road, cityBuildings = [], streetLights = [];
        let gameMode = 'AI';
        let isPlaying = false;
        let audioCtx, engineOsc;

        let playerState = { x: -2.4, z: 0, speed: 0, maxSpeed: 180, accel: 0.45, nitro: 100, isNitro: false, distance: 0 };
        let opponentState = { x: 2.4, z: -8, speed: 0, distance: -8 };
        let keys = { w: false, a: false, s: false, d: false, space: false };

        let networkChannel = null;

        function initEngine() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020205, 0.008);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);

            const moonLight = new THREE.DirectionalLight(0x6688ff, 0.4);
            moonLight.position.set(30, 60, -20);
            scene.add(moonLight);

            buildHighwayEnvironment();

            playerCar = createDetailedCar(0x00f3ff, true);
            opponentCar = createDetailedCar(0xff0055, false);
            scene.add(playerCar);
            scene.add(opponentCar);

            for (let i = 0; i < 5; i++) {
                let traffic = createDetailedCar(0x555566, false);
                traffic.position.set((Math.random() > 0.5 ? 1 : -1) * (2 + Math.random()*3.5), 0, -80 - i*70);
                scene.add(traffic);
                trafficCars.push(traffic);
            }

            window.addEventListener('keydown', e => handleKey(e, true));
            window.addEventListener('keyup', e => handleKey(e, false));
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function buildHighwayEnvironment() {
            const roadGeo = new THREE.PlaneGeometry(20, 4000);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0f, roughness: 0.3, metalness: 0.8 });
            road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            scene.add(road);

            const lineGeo = new THREE.PlaneGeometry(0.3, 4000);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const centerLine = new THREE.Mesh(lineGeo, lineMat);
            centerLine.rotation.x = -Math.PI / 2;
            centerLine.position.y = 0.01;
            scene.add(centerLine);

            for (let i = 0; i < 30; i++) {
                let pole = new THREE.Group();
                let poleMesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.12, 0.12, 9),
                    new THREE.MeshStandardMaterial({ color: 0x333344, metalness: 0.9 })
                );
                poleMesh.position.y = 4.5;
                pole.add(poleMesh);

                let lightPoint = new THREE.PointLight(0xffaa44, 1.2, 35);
                lightPoint.position.set(0, 8.5, 0);
                pole.add(lightPoint);

                pole.position.set(-11, 0, -i * 120);
                scene.add(pole);
                streetLights.push(pole);
            }

            for (let i = 0; i < 40; i++) {
                let h = 40 + Math.random() * 80;
                let w = 20 + Math.random() * 30;
                let buildingMat = new THREE.MeshStandardMaterial({ 
                    color: 0x050810, 
                    roughness: 0.5,
                    emissive: (Math.random() > 0.4) ? 0x002244 : 0x220011,
                    emissiveIntensity: 0.2
                });
                let building = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), buildingMat);
                let side = (i % 2 === 0) ? 1 : -1;
                building.position.set(side * (45 + Math.random() * 20), h / 2, -i * 90);
                scene.add(building);
                cityBuildings.push(building);
            }
        }

        function createDetailedCar(colorHex, isPlayer) {
            const carGroup = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.2, metalness: 0.8 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x050508, roughness: 0.1, metalness: 0.9 });
            const chromeMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.1, metalness: 1.0 });

            const lowerBody = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.65, 4.4), bodyMat);
            lowerBody.position.y = 0.45;
            carGroup.add(lowerBody);

            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 2.2), darkMat);
            cabin.position.set(0, 0.95, -0.2);
            carGroup.add(cabin);

            const spoilerPlate = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.08, 0.4), bodyMat);
            spoilerPlate.position.set(0, 1.05, 2.0);
            const spoilerLegL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.1), darkMat);
            spoilerLegL.position.set(-0.7, 0.85, 2.0);
            const spoilerLegR = spoilerLegL.clone();
            spoilerLegR.position.x = 0.7;
            carGroup.add(spoilerPlate, spoilerLegL, spoilerLegR);

            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.28, 16);
            wheelGeo.rotateZ(Math.PI / 2);

            const wheelPositions = [
                [-1.02, 0.35, -1.3],
                [ 1.02, 0.35, -1.3],
                [-1.02, 0.35,  1.3],
                [ 1.02, 0.35,  1.3]
            ];

            wheelPositions.forEach(pos => {
                let wheel = new THREE.Mesh(wheelGeo, darkMat);
                wheel.position.set(...pos);
                let rim = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.3, 8), chromeMat);
                rim.rotateZ(Math.PI / 2);
                wheel.add(rim);
                carGroup.add(wheel);
            });

            if (isPlayer) {
                const headlightL = new THREE.SpotLight(0xffffff, 3.5, 60, Math.PI / 6, 0.4);
                headlightL.position.set(-0.7, 0.5, -2.1);
                headlightL.target.position.set(-0.7, 0, -20);
                carGroup.add(headlightL, headlightL.target);

                const headlightR = headlightL.clone();
                headlightR.position.x = 0.7;
                headlightR.target.position.set(0.7, 0, -20);
                carGroup.add(headlightR, headlightR.target);
            }

            const tailLightMat = new THREE.MeshBasicMaterial({ color: 0xff0022 });
            const tailL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.05), tailLightMat);
            tailL.position.set(-0.65, 0.55, 2.21);
            const tailR = tailL.clone();
            tailR.position.x = 0.65;
            carGroup.add(tailL, tailR);

            return carGroup;
        }

        function handleKey(e, isDown) {
            const k = e.code;
            if (k === 'KeyW' || k === 'ArrowUp') keys.w = isDown;
            if (k === 'KeyS' || k === 'ArrowDown') keys.s = isDown;
            if (k === 'KeyA' || k === 'ArrowLeft') keys.a = isDown;
            if (k === 'KeyD' || k === 'ArrowRight') keys.d = isDown;
            if (k === 'Space') keys.space = isDown;
        }

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            engineOsc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(45, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            engineOsc.connect(gain);
            gain.connect(audioCtx.destination);
            engineOsc.start();
        }

        function updateAudio() {
            if (!audioCtx || !engineOsc) return;
            const pitch = 45 + (playerState.speed / playerState.maxSpeed) * 120;
            engineOsc.frequency.setTargetAtTime(pitch, audioCtx.currentTime, 0.1);
        }

        function startSingleplayer() {
            gameMode = 'AI';
            document.getElementById('mode-text').innerText = "VS AI (PRO)";
            launchGame();
        }

        function showOnlineMenu() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('online-menu').style.display = 'block';
        }

        function hideOnlineMenu() {
            document.getElementById('online-menu').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';
        }

        function startOnlineMatch() {
            gameMode = 'ONLINE';
            const roomId = document.getElementById('room-id-input').value;
            document.getElementById('mode-text').innerText = "ONLINE: " + roomId;
            
            networkChannel = new BroadcastChannel('c1_room_' + roomId);
            networkChannel.onmessage = (e) => {
                if (e.data && e.data.type === 'SYNC') {
                    opponentState.x = e.data.x;
                    opponentState.z = e.data.z;
                    opponentState.speed = e.data.speed;
                    opponentState.distance = e.data.distance;
                }
            };

            document.getElementById('online-menu').style.display = 'none';
            launchGame();
        }

        function launchGame() {
            initAudio();
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            
            playerState = { x: -2.4, z: 0, speed: 0, maxSpeed: 180, accel: 0.45, nitro: 100, isNitro: false, distance: 0 };
            opponentState = { x: 2.4, z: -8, speed: 0, distance: -8 };
            
            isPlaying = true;
        }

        function returnToMenu() {
            document.getElementById('game-over-menu').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';
            document.getElementById('hud').style.display = 'none';
            isPlaying = false;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                if (keys.space && playerState.nitro > 0) {
                    playerState.isNitro = true;
                    playerState.nitro = Math.max(0, playerState.nitro - 0.3);
                    playerState.speed = Math.min(playerState.speed + playerState.accel * 1.8, playerState.maxSpeed + 30);
                } else {
                    playerState.isNitro = false;
                    if (playerState.nitro < 100) playerState.nitro += 0.08;
                    
                    if (keys.w) {
                        playerState.speed = Math.min(playerState.speed + playerState.accel, playerState.maxSpeed);
                    } else if (keys.s) {
                        playerState.speed = Math.max(playerState.speed - 1.2, 0);
                    } else {
                        playerState.speed = Math.max(playerState.speed - 0.2, 0);
                    }
                }

                if (keys.a && playerState.x > -7.0) playerState.x -= 0.09;
                if (keys.d && playerState.x < 7.0) playerState.x += 0.09;

                let moveDelta = playerState.speed * 0.025;
                playerState.z -= moveDelta;
                playerState.distance += moveDelta;

                if (gameMode === 'AI') {
                    let targetSpeed = 165 + (playerState.distance > opponentState.distance ? 15 : -8);
                    opponentState.speed += (targetSpeed - opponentState.speed) * 0.015;
                    let oppDelta = opponentState.speed * 0.025;
                    opponentState.z -= oppDelta;
                    opponentState.distance += oppDelta;
                } else if (networkChannel) {
                    networkChannel.postMessage({
                        type: 'SYNC',
                        x: playerState.x,
                        z: playerState.z,
                        speed: playerState.speed,
                        distance: playerState.distance
                    });
                }

                playerCar.position.set(playerState.x, 0, playerState.z);
                opponentCar.position.set(opponentState.x, 0, opponentState.z);

                trafficCars.forEach((tc) => {
                    tc.position.z += 0.3;
                    if (tc.position.z > playerCar.position.z + 15) {
                        tc.position.z = playerCar.position.z - 150 - Math.random() * 80;
                        tc.position.x = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 4);
                    }

                    if (Math.abs(playerCar.position.z - tc.position.z) < 3.8 && Math.abs(playerCar.position.x - tc.position.x) < 1.7) {
                        playerState.speed *= 0.6;
                    }
                });

                let camSteerTilt = (keys.a ? 0.05 : 0) - (keys.d ? 0.05 : 0);
                camera.position.set(playerState.x * 0.4, playerCar.position.y + 2.5, playerCar.position.z + 6.8);
                camera.rotation.z = camSteerTilt;
                camera.lookAt(playerState.x * 0.7, playerCar.position.y + 0.9, playerCar.position.z - 15);

                updateAudio();

                document.getElementById('speed-num').innerText = Math.round(playerState.speed);
                document.getElementById('nitro-fill').style.width = playerState.nitro + '%';
                document.getElementById('pos-text').innerText = playerState.distance >= opponentState.distance ? '1ST' : '2ND';

                if (playerState.distance >= 2000 || opponentState.distance >= 2000) {
                    isPlaying = false;
                    document.getElementById('hud').style.display = 'none';
                    document.getElementById('game-over-menu').style.display = 'block';
                    
                    const won = playerState.distance >= opponentState.distance;
                    document.getElementById('result-title').innerText = won ? "MENANG!" : "KALAH!";
                    document.getElementById('result-title').style.color = won ? "#00f3ff" : "#ff0055";
                    document.getElementById('result-desc').innerText = won ? "Tahniah! Anda menguasai Lebuh Raya Shuto!" : "Lawan anda telah memotong di garisan penamat.";
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        initEngine();
    </script>
</body>
</html>
